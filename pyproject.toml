[project]
name = "agent-eval-kit"
version = "0.1.0"
description = "A test kit that checks whether an AI phone receptionist gives factually correct answers."
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.0", "pytest>=7.0"]

[tool.pytest.ini_options]
# Put src/ on the import path so the tests can `import grader` directly,
# instead of each test file editing sys.path by hand.
pythonpath = ["src"]
testpaths = ["tests"]
